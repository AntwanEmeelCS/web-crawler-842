          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navBarLinks navbar-nav me-auto mb-2 mb-lg-0">

                  <i class="fa-brands fa-bootstrap"></i>
                  <p>Bootstrap</p>
                </div>
                <div class="stackButton stackButtonTailwind">

                </div>

                <div class="stackButton stackButtonAngular">
                  <i class="fa-brands fa-angular"></i>

                </div>
                <div class="stackButton stackButtonReact">
                  <i class="fa-brands fa-react"></i>
